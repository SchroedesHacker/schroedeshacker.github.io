<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RustDesk Web</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <iframe
        src="https://rustdesk.com/web"
        title="RustDesk Web Client"
        allow="clipboard-read; clipboard-write; fullscreen"
        allowfullscreen
    ></iframe>
</body>
</html>
